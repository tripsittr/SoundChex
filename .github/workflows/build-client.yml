#
# Builds the desktop client (the Tauri app) on macOS, Windows and Linux (S-33).
#
# The client was only ever built on macOS, so a change that broke the Windows or
# Linux build was invisible until someone tried it. This compiles it on all
# three on every push to main and every tag, so a break surfaces in CI rather
# than on a user's machine. The bundled *server* runtime is built separately
# (build-server.yml); this is the client app itself.
#
# It does not run the resulting binaries — a build succeeding is the signal, the
# thing that used to go untested. Tagged builds attach the installers to the
# release.

name: Build desktop client

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'client-v*'
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/build-client.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
          - os: ubuntu-latest
            label: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Cache the Rust build between runs — Tauri's dependency tree is large.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux needs the WebKitGTK stack and its build deps; macOS and Windows
      # ship what Tauri needs. webkit2gtk-4.1 is the current (Tauri v2) package.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install npm dependencies
        run: npm ci

      # Compiles the frontend (via beforeBuildCommand) and the Rust client, and
      # bundles the installer. A failure here is the break this workflow exists
      # to catch.
      - name: Build the client
        run: npm run tauri:build

      - name: Upload the build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: soundchex-client-${{ matrix.label }}
          # The bundle layout differs per OS; take whatever tauri produced.
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
