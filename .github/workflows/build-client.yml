#
# Builds the desktop client (the Tauri app) on macOS, Windows and Linux (S-33).
#
# The client was only ever built on macOS, so a change that broke the Windows or
# Linux build was invisible until someone tried it. This compiles it on all
# three on every push to main and every tag, so a break surfaces in CI rather
# than on a user's machine. The bundled *server* runtime is built separately
# (build-server.yml); this is the client app itself.
#
# It does not run the resulting binaries — a build succeeding is the signal, the
# thing that used to go untested. Tagged builds attach the installers to the
# release.

name: Build desktop client

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'client-v*'
    # `paths` applies to branch pushes only — a tag push carrying none of
    # these would otherwise build nothing, and the release job would have no
    # artifacts to publish (S-421).
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/build-client.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
          - os: ubuntu-latest
            label: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # The frontend build imports the Filament theme from vendor/, so Composer
      # packages must be present before `npm run build` (Tauri's
      # beforeBuildCommand) runs — this is what a macOS-only build hid.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # The extensions Filament and the league packages require. On Windows
          # they are not enabled by default, so composer install refuses the
          # locked set without them — the break the Windows build surfaced.
          extensions: intl, fileinfo, mbstring, dom, curl, zip, gd

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev

      - uses: dtolnay/rust-toolchain@stable

      # Cache the Rust build between runs — Tauri's dependency tree is large.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux needs the WebKitGTK stack and its build deps; macOS and Windows
      # ship what Tauri needs. webkit2gtk-4.1 is the current (Tauri v2) package.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install npm dependencies
        run: npm ci

      # Compiles the frontend (via beforeBuildCommand) and the Rust client, and
      # bundles the installer. A failure here is the break this workflow exists
      # to catch.
      - name: Build the client
        run: npm run tauri:build

      - name: Upload the build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: soundchex-client-${{ matrix.label }}
          # The bundle layout differs per OS; take whatever tauri produced.
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: warn

  # Publishes the installers a `client-v*` tag was cut for.
  #
  # Marked a pre-release when the tag carries a suffix — `client-v0.2.0-beta.1`
  # is a pre-release, `client-v0.2.0` is not. GitHub then keeps it off the
  # "Latest" badge that the download page's releases/latest link follows, so a
  # beta cannot be handed to someone who only wanted the stable build.
  release:
    # Publishing needs write access to releases. The default token is
    # read-only for this repository, so without this the job builds
    # everything and then 403s at the upload — "Resource not accessible by
    # integration", which reads like a broken action rather than a missing
    # permission (S-421).
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/client-v')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }

      # Tauri writes each bundle into its own directory (msi/, dmg/, deb/) and
      # the artifact download flattens those into one tree, so collect the
      # installers by extension rather than by a path that differs per OS.
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} upload/ \;
          ls -la upload

      - uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
