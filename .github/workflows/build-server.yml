# SoundChex bundled server runtime — per-OS static PHP + php-fpm + Caddy (S-151).
#
# static-php-cli cannot cross-compile, so each OS builds on its own runner using
# the official prebuilt `spc` binary (dl.static-php.dev) — the exact flow proven
# locally: doctor -> download (sqlite from SOURCE, for column metadata) -> build
# cli+fpm -> package (adds Caddy + cacert.pem + templates + notices).
#
# Artifacts: soundchex-server-<os>-<arch>.(tar.gz|zip) + .sha256, uploaded per
# job (and attached to a release when tagged server-v*).

name: Build bundled server runtime

on:
  workflow_dispatch:
  push:
    tags:
      - 'server-v*'

env:
  PHP_VERSION: '8.4'
  EXTENSIONS: 'bcmath,ctype,curl,dom,exif,fileinfo,filter,gd,gmp,iconv,intl,mbstring,opcache,openssl,pcntl,pdo,pdo_sqlite,phar,session,sodium,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zip,zlib'

jobs:
  # POSIX targets: php-fpm behind Caddy, the proven flow.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    spc_os: linux,   arch: x86_64,  spc_bin: spc-linux-x86_64 }
          - { os: ubuntu-24.04-arm, spc_os: linux,   arch: aarch64, spc_bin: spc-linux-aarch64 }
          - { os: macos-latest,     spc_os: macos,   arch: aarch64, spc_bin: spc-macos-aarch64 }
          - { os: macos-13,         spc_os: macos,   arch: x86_64,  spc_bin: spc-macos-x86_64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.spc_os }}-${{ matrix.arch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Fetch spc
        run: |
          curl -fsSL -o spc "https://dl.static-php.dev/static-php-cli/spc-bin/nightly/${{ matrix.spc_bin }}"
          chmod +x spc || true
          ./spc --version

      - name: Doctor (install build prerequisites)
        run: ./spc doctor --auto-fix --no-interaction

      # Prefer prebuilt libs for speed/reliability (matches the proven local
      # flow), then force sqlite specifically to build from SOURCE: the prebuilt
      # sqlite lib lacks SQLITE_ENABLE_COLUMN_METADATA, which Laravel's schema
      # introspection needs and spc's sanity check rejects. We drop the prebuilt
      # sqlite lock entry so spc uses the source tarball.
      - name: Download sources (prebuilt libs)
        run: ./spc download --for-extensions="$EXTENSIONS" --with-php="$PHP_VERSION" --prefer-pre-built --retry=3

      # Fetch the sqlite SOURCE tarball (plain download, no --prefer-pre-built),
      # then drop the prebuilt sqlite lock entry + archive so the build uses the
      # source (which sets SQLITE_ENABLE_COLUMN_METADATA), and extract it.
      - name: Force sqlite from source (column metadata)
        run: |
          ./spc download sqlite --ignore-cache-sources=sqlite --retry=3
          python3 - <<'PY'
          import json, os, glob
          lock = 'downloads/.lock.json'
          d = json.load(open(lock))
          # Drop the prebuilt sqlite entry (sqlite-<os>-<arch>--default); keep the
          # plain "sqlite" source entry that the download above just added.
          for k in [k for k in list(d) if k.startswith('sqlite-') and k != 'sqlite']:
              d.pop(k, None)
          json.dump(d, open(lock, 'w'), indent=2)
          for f in glob.glob('downloads/sqlite-*-*.txz'):
              os.remove(f)
          assert 'sqlite' in d, 'sqlite source entry missing after download'
          print('sqlite pinned to source')
          PY
          rm -rf source/sqlite
          ./spc extract sqlite

      - name: Build PHP (cli + fpm)
        run: ./spc build "$EXTENSIONS" --build-cli --build-fpm

      - name: Package runtime
        run: |
          mkdir -p dist
          server/scripts/package-runtime.sh \
            "${{ matrix.spc_os }}" "${{ matrix.arch }}" \
            buildroot/bin/php buildroot/bin/php-fpm dist

      - uses: actions/upload-artifact@v4
        with:
          name: soundchex-server-${{ matrix.spc_os }}-${{ matrix.arch }}
          path: |
            dist/soundchex-server-*.tar.gz
            dist/soundchex-server-*.sha256
          if-no-files-found: warn

  # Windows: PHP ships no php-fpm SAPI, and static-php-cli documents only cli +
  # micro for Windows (no fpm, no cgi). So the POSIX "Caddy -> php-fpm" shape
  # doesn't port. We build the Windows php.exe CLI (achievable + useful: the
  # queue worker, scheduler and artisan all run on it) and package it with Caddy;
  # the HTTP-serving front (FrankenPHP embed, or a FastCGI shim) is resolved in
  # Step 4's Windows service work. Runs in pwsh for correct Windows path handling.
  # Pinned to windows-2022 (VS 2022): the nightly spc's doctor recognizes only
  # VS 2019/2022, and windows-latest has moved to VS 18 which it rejects with
  # "Visual Studio not installed". Revisit when spc supports VS 18.
  build-windows:
    runs-on: windows-2022
    name: windows-x86_64
    env:
      # EXTENSIONS minus gmp (spc can't compile it on Windows yet) and pcntl
      # (POSIX-only — process signals don't exist on Windows; the queue worker
      # falls back accordingly).
      WIN_EXTENSIONS: 'bcmath,ctype,curl,dom,exif,fileinfo,filter,gd,iconv,intl,mbstring,opcache,openssl,pdo,pdo_sqlite,phar,session,sodium,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zip,zlib'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # spc's doctor detects Visual Studio via vswhere but needs the MSVC dev
      # environment activated; without it, doctor reports "Visual Studio not
      # installed" even though windows-latest ships VS 2022. This sets up the
      # x64 developer environment (vcvars) for the whole job.
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch spc
        run: curl.exe -fsSL -o spc.exe "https://dl.static-php.dev/static-php-cli/spc-bin/nightly/spc-windows-x64.exe"

      # doctor --auto-fix downloads php-sdk-binary-tools / nasm, which
      # occasionally 500s from the upstream mirror. Retry a few times.
      - name: Doctor (installs php-sdk-binary-tools, strawberry-perl, nasm)
        run: |
          for ($i=1; $i -le 4; $i++) {
            .\spc.exe doctor --auto-fix --no-interaction
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "doctor attempt $i failed (exit $LASTEXITCODE); retrying in 15s..."
            Start-Sleep -Seconds 15
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # gmp cannot be compiled on Windows by spc ("not supported to compile").
      # It is optional for us (ramsey/uuid only *suggests* it for perf), so the
      # Windows build drops it. Everything else in the set is Windows-buildable.
      - name: Download sources
        run: .\spc.exe download --for-extensions="$env:WIN_EXTENSIONS" --with-php="$env:PHP_VERSION" --prefer-pre-built --retry=3

      - name: Build PHP CLI
        run: .\spc.exe build "$env:WIN_EXTENSIONS" --build-cli

      - name: Package (php.exe + caddy, no fpm)
        shell: bash
        run: |
          mkdir -p dist
          server/scripts/package-runtime.sh windows x86_64 \
            buildroot/bin/php.exe buildroot/bin/php.exe dist

      - uses: actions/upload-artifact@v4
        with:
          name: soundchex-server-windows-x86_64
          path: |
            dist/soundchex-server-*.zip
            dist/soundchex-server-*.sha256
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/server-v')
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/soundchex-server-*.tar.gz
            dist/soundchex-server-*.zip
            dist/soundchex-server-*.sha256
