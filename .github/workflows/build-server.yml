# SoundChex bundled server runtime — per-OS static PHP + php-fpm + Caddy (S-151).
#
# static-php-cli cannot cross-compile, so each OS builds on its own runner using
# the official prebuilt `spc` binary (dl.static-php.dev) — the exact flow proven
# locally: doctor -> download (sqlite from SOURCE, for column metadata) -> build
# cli+fpm -> package (adds Caddy + cacert.pem + templates + notices).
#
# Artifacts: soundchex-server-<os>-<arch>.(tar.gz|zip) + .sha256, uploaded per
# job (and attached to a release when tagged server-v*).

name: Build bundled server runtime

on:
  workflow_dispatch:
  push:
    tags:
      - 'server-v*'

env:
  PHP_VERSION: '8.4'
  EXTENSIONS: 'bcmath,ctype,curl,dom,exif,fileinfo,filter,gd,gmp,iconv,intl,mbstring,opcache,openssl,pcntl,pdo,pdo_sqlite,phar,session,sodium,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zip,zlib'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    spc_os: linux,   arch: x86_64,  spc_bin: spc-linux-x86_64 }
          - { os: ubuntu-24.04-arm, spc_os: linux,   arch: aarch64, spc_bin: spc-linux-aarch64 }
          - { os: macos-latest,     spc_os: macos,   arch: aarch64, spc_bin: spc-macos-aarch64 }
          - { os: macos-13,         spc_os: macos,   arch: x86_64,  spc_bin: spc-macos-x86_64 }
          - { os: windows-latest,   spc_os: windows, arch: x86_64,  spc_bin: spc-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.spc_os }}-${{ matrix.arch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Fetch spc
        run: |
          curl -fsSL -o spc "https://dl.static-php.dev/static-php-cli/spc-bin/nightly/${{ matrix.spc_bin }}"
          chmod +x spc || true
          ./spc --version

      - name: Doctor (install build prerequisites)
        run: ./spc doctor --auto-fix --no-interaction

      # Prefer prebuilt libs for speed/reliability (matches the proven local
      # flow), then force sqlite specifically to build from SOURCE: the prebuilt
      # sqlite lib lacks SQLITE_ENABLE_COLUMN_METADATA, which Laravel's schema
      # introspection needs and spc's sanity check rejects. We drop the prebuilt
      # sqlite lock entry so spc uses the source tarball.
      - name: Download sources (prebuilt libs)
        run: ./spc download --for-extensions="$EXTENSIONS" --with-php="$PHP_VERSION" --prefer-pre-built

      # Fetch the sqlite SOURCE tarball (plain download, no --prefer-pre-built),
      # then drop the prebuilt sqlite lock entry + archive so the build uses the
      # source (which sets SQLITE_ENABLE_COLUMN_METADATA), and extract it.
      - name: Force sqlite from source (column metadata)
        run: |
          ./spc download sqlite --ignore-cache-sources=sqlite
          python3 - <<'PY'
          import json, os, glob
          lock = 'downloads/.lock.json'
          d = json.load(open(lock))
          # Drop the prebuilt sqlite entry (sqlite-<os>-<arch>--default); keep the
          # plain "sqlite" source entry that the download above just added.
          for k in [k for k in list(d) if k.startswith('sqlite-') and k != 'sqlite']:
              d.pop(k, None)
          json.dump(d, open(lock, 'w'), indent=2)
          for f in glob.glob('downloads/sqlite-*-*.txz'):
              os.remove(f)
          assert 'sqlite' in d, 'sqlite source entry missing after download'
          print('sqlite pinned to source')
          PY
          rm -rf source/sqlite
          ./spc extract sqlite

      - name: Build PHP (cli + fpm on POSIX; cli only on Windows)
        run: |
          if [ "${{ matrix.spc_os }}" = "windows" ]; then
            ./spc build "$EXTENSIONS" --build-cli
          else
            ./spc build "$EXTENSIONS" --build-cli --build-fpm
          fi

      - name: Package runtime (POSIX)
        if: matrix.spc_os != 'windows'
        run: |
          mkdir -p dist
          server/scripts/package-runtime.sh \
            "${{ matrix.spc_os }}" "${{ matrix.arch }}" \
            buildroot/bin/php buildroot/bin/php-fpm dist

      # Windows: no php-fpm SAPI. Ship php.exe + caddy; php-cgi packaging + the
      # Caddy php_fastcgi-to-php-cgi story is a Step-4 follow-up.
      - name: Package runtime (Windows)
        if: matrix.spc_os == 'windows'
        run: |
          mkdir -p dist
          server/scripts/package-runtime.sh \
            windows "${{ matrix.arch }}" \
            buildroot/bin/php.exe buildroot/bin/php.exe dist || true

      - uses: actions/upload-artifact@v4
        with:
          name: soundchex-server-${{ matrix.spc_os }}-${{ matrix.arch }}
          path: |
            dist/soundchex-server-*.tar.gz
            dist/soundchex-server-*.zip
            dist/soundchex-server-*.sha256
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/server-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/soundchex-server-*.tar.gz
            dist/soundchex-server-*.zip
            dist/soundchex-server-*.sha256
