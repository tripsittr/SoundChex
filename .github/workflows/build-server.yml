# SoundChex bundled server runtime — per-OS static PHP + php-fpm + Caddy (S-151).
#
# static-php-cli cannot cross-compile, so each OS builds on its own runner using
# the official prebuilt `spc` binary (dl.static-php.dev) — the exact flow proven
# locally: doctor -> download (sqlite from SOURCE, for column metadata) -> build
# cli+fpm -> package (adds Caddy + cacert.pem + templates + notices).
#
# Artifacts: soundchex-server-<os>-<arch>.(tar.gz|zip) + .sha256, uploaded per
# job (and attached to a release when tagged server-v*). The Linux Server app is
# attached too, as soundchex-server-app-linux-<arch>.(deb|AppImage) + .sha256.

name: Build bundled server runtime

on:
  workflow_dispatch:
  push:
    tags:
      - 'server-v*'

env:
  PHP_VERSION: '8.4'
  EXTENSIONS: 'bcmath,ctype,curl,dom,exif,fileinfo,filter,gd,gmp,iconv,intl,mbstring,opcache,openssl,pcntl,pdo,pdo_sqlite,phar,session,sodium,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zip,zlib'
  # spc queries the GitHub API for hosted release assets; unauthenticated it hits
  # the 60/hr rate limit and 403s. The Actions-provided token raises that to
  # 5000/hr. spc reads GITHUB_TOKEN from the environment.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # POSIX targets: php-fpm behind Caddy, the proven flow.
  build:
    strategy:
      fail-fast: false
      matrix:
        # No Intel macOS. `macos-13` was the last GitHub-hosted x86_64 image
        # and it is gone: every run of this workflow since it was written sat
        # 24 hours waiting for a runner that never came, was cancelled at the
        # limit, and took the release job down with it — which is why no
        # server release has ever published.
        #
        # Apple Silicon has been the only Mac sold since 2023 and an Intel Mac
        # can run the aarch64 build under Rosetta 2. If an Intel build is
        # wanted later it needs a self-hosted runner.
        include:
          - { os: ubuntu-latest,    spc_os: linux,   arch: x86_64,  spc_bin: spc-linux-x86_64 }
          - { os: ubuntu-24.04-arm, spc_os: linux,   arch: aarch64, spc_bin: spc-linux-aarch64 }
          - { os: macos-latest,     spc_os: macos,   arch: aarch64, spc_bin: spc-macos-aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    name: ${{ matrix.spc_os }}-${{ matrix.arch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Fetch spc
        run: |
          curl -fsSL -o spc "https://dl.static-php.dev/static-php-cli/spc-bin/nightly/${{ matrix.spc_bin }}"
          chmod +x spc || true
          ./spc --version

      - name: Doctor (install build prerequisites)
        run: ./spc doctor --auto-fix --no-interaction

      # Prefer prebuilt libs for speed/reliability (matches the proven local
      # flow), then force sqlite specifically to build from SOURCE: the prebuilt
      # sqlite lib lacks SQLITE_ENABLE_COLUMN_METADATA, which Laravel's schema
      # introspection needs and spc's sanity check rejects. We drop the prebuilt
      # sqlite lock entry so spc uses the source tarball.
      - name: Download sources (prebuilt libs)
        run: ./spc download --for-extensions="$EXTENSIONS" --with-php="$PHP_VERSION" --prefer-pre-built --retry=3

      # Fetch the sqlite SOURCE tarball (plain download, no --prefer-pre-built),
      # then drop the prebuilt sqlite lock entry + archive so the build uses the
      # source (which sets SQLITE_ENABLE_COLUMN_METADATA), and extract it.
      - name: Force sqlite from source (column metadata)
        run: |
          ./spc download sqlite --ignore-cache-sources=sqlite --retry=3
          python3 - <<'PY'
          import json, os, glob
          lock = 'downloads/.lock.json'
          d = json.load(open(lock))
          # Drop the prebuilt sqlite entry (sqlite-<os>-<arch>--default); keep the
          # plain "sqlite" source entry that the download above just added.
          for k in [k for k in list(d) if k.startswith('sqlite-') and k != 'sqlite']:
              d.pop(k, None)
          json.dump(d, open(lock, 'w'), indent=2)
          for f in glob.glob('downloads/sqlite-*-*.txz'):
              os.remove(f)
          assert 'sqlite' in d, 'sqlite source entry missing after download'
          print('sqlite pinned to source')
          PY
          rm -rf source/sqlite
          ./spc extract sqlite

      - name: Build PHP (cli + fpm)
        run: ./spc build "$EXTENSIONS" --build-cli --build-fpm

      - name: Package runtime
        run: |
          mkdir -p dist
          server/scripts/package-runtime.sh \
            "${{ matrix.spc_os }}" "${{ matrix.arch }}" \
            buildroot/bin/php buildroot/bin/php-fpm dist

      - uses: actions/upload-artifact@v4
        with:
          name: soundchex-server-${{ matrix.spc_os }}-${{ matrix.arch }}
          path: |
            dist/soundchex-server-*.tar.gz
            dist/soundchex-server-*.sha256
          if-no-files-found: warn

  # Windows: PHP ships no php-fpm SAPI, and static-php-cli documents only cli +
  # micro for Windows (no fpm, no cgi). So the POSIX "Caddy -> php-fpm" shape
  # doesn't port. We build the Windows php.exe CLI (achievable + useful: the
  # queue worker, scheduler and artisan all run on it) and package it with Caddy;
  # the HTTP-serving front (FrankenPHP embed, or a FastCGI shim) is resolved in
  # Step 4's Windows service work. Runs in pwsh for correct Windows path handling.
  # Pinned to windows-2022 (VS 2022): the nightly spc's doctor recognizes only
  # Windows: PHP ships no php-fpm SAPI, so the POSIX "Caddy -> php-fpm" shape
  # cannot be built there. FrankenPHP is the web server and PHP in one binary,
  # and its official Windows release carries a complete PHP -- so that archive
  # is the runtime, and static-php-cli is not involved on Windows at all.
  #
  # This used to compile PHP with spc, which needed an MSVC dev environment, a
  # retry loop around a flaky doctor step, a windows-2022 pin (spc rejects VS
  # 18) and about forty minutes -- to produce a php.exe that the bundle then
  # shipped alongside a frankenphp.exe copied out of its archive without the
  # DLLs it is linked against. That bundle could not start. Downloading the
  # archive whole is both correct and minutes rather than tens of minutes.
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    name: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Package (frankenphp + php from the official archive)
        run: |
          mkdir -p dist
          server/scripts/package-runtime.sh windows x86_64 "" "" dist

      - uses: actions/upload-artifact@v4
        with:
          name: soundchex-server-windows-x86_64
          path: |
            dist/soundchex-server-*.zip
            dist/soundchex-server-*.sha256
          if-no-files-found: warn

  # The Server app itself -- the Tauri shell that carries the runtime above.
  #
  # Nothing built this in CI before: build-client.yml builds only the client,
  # and the jobs above build only the runtime it bundles. The one install path
  # that existed was scripts/reinstall-server-app.sh, which is macOS-only and
  # runs on a developer's machine, so a break on Windows or Linux could not be
  # seen until someone tried it there.
  #
  # It does not run the result: a build succeeding is the signal, exactly as in
  # build-client.yml.
  app:
    needs: [build, build-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   label: macOS,   runtime: soundchex-server-macos-aarch64 }
          - { os: windows-latest, label: Windows, runtime: soundchex-server-windows-x86_64 }
          # aarch64 only for now: it is what HatCOS is tested on, in the native
          # ARM VM on the Mac. The x86_64 Linux app is held back deliberately
          # rather than dropped -- its runtime still builds above, and adding
          # it back is this one line with ubuntu-latest and linux-x86_64.
          - { os: ubuntu-24.04-arm, label: Linux, runtime: soundchex-server-linux-aarch64, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    # Every job gets one. A missing runner otherwise sits 24 hours and reports
    # itself "cancelled" — which is how no server release ever published
    # (S-419).
    timeout-minutes: 60
    name: app-${{ matrix.label }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # The frontend build imports the Filament theme from vendor/, so Composer
      # packages must exist before tauri's beforeBuildCommand runs.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, fileinfo, mbstring, dom, curl, zip, gd

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # By runner OS, not by image name: the Linux leg is ubuntu-24.04-arm now,
      # and a check against 'ubuntu-latest' would silently skip this and fail
      # the build on a missing webkit header.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install npm dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.runtime }}
          path: runtime-archive

      # src-tauri/runtime is gitignored, so a fresh checkout has none and the
      # bundle would be built without the resources that are its whole point.
      - name: Stage the runtime
        run: |
          mkdir -p runtime-unpacked

          # `find`, not `ls` of two globs. The job runs under `-e -o pipefail`,
          # and `ls a* b*` exits non-zero when *either* pattern matches nothing
          # — which is always, since a platform ships a .tar.gz or a .zip and
          # never both. `pipefail` then carried that through `| head -1` and
          # killed the step in 28ms, before its own error message could print.
          # Every platform failed identically and said nothing about why.
          archive=$(find runtime-archive -maxdepth 1 \
            \( -name 'soundchex-server-*.tar.gz' -o -name 'soundchex-server-*.zip' \) \
            | head -1 || true)

          [ -n "$archive" ] || { echo "no runtime archive downloaded"; ls -R runtime-archive; exit 1; }
          # PowerShell for the Windows zip, not `unzip`.
          #
          # package-runtime.sh builds it with Compress-Archive when git-bash
          # has no `zip` CLI — which on the runner is always — and
          # Compress-Archive writes BACKSLASH path separators. Info-ZIP warns
          # and then extracts the entries as flat files with literal
          # backslashes in their names:
          #
          #     warning: ... appears to use backslashes as path separators
          #
          # so no directory is created, the `find -type d` below matches
          # nothing, and the step fails saying the bundle is missing. The
          # archive is fine; `unzip` simply cannot read what Windows wrote.
          # Expand-Archive reads its own format correctly.
          case "$archive" in
            *.zip)
              if command -v powershell >/dev/null 2>&1; then
                powershell -NoProfile -Command \
                  "Expand-Archive -Path '$archive' -DestinationPath 'runtime-unpacked' -Force"
              else
                unzip -q "$archive" -d runtime-unpacked
              fi
              ;;
            *.tar.gz) tar -xzf "$archive" -C runtime-unpacked ;;
          esac
          # `|| true` for the same reason: a pipeline whose head closes early
          # must not decide this step's exit status.
          bundle=$(find runtime-unpacked -maxdepth 1 -type d -name 'soundchex-server-*' | head -1 || true)
          [ -n "$bundle" ] || { echo "no bundle directory inside $archive"; exit 1; }
          scripts/stage-server-runtime.sh "$bundle"

      # Fails loudly rather than producing an installer with no runtime in it.
      - name: Check the runtime is staged
        run: |
          test -d src-tauri/runtime/bin || { echo "runtime/bin missing"; exit 1; }
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            test -s src-tauri/runtime/bin/frankenphp.exe || { echo "frankenphp.exe missing"; exit 1; }
            test -d src-tauri/runtime/bin/ext || { echo "bin/ext missing -- extensions would not load"; exit 1; }
          else
            test -s src-tauri/runtime/bin/php-fpm || { echo "php-fpm missing"; exit 1; }
          fi

      # tauri.server.conf.json declares `app-payload.zip` as a bundle resource,
      # and tauri-build panics outright if it is absent:
      #
      #     failed to run tauri-build: resource path `app-payload.zip` doesn't exist
      #
      # Nothing in package.json, the scripts or this workflow had ever created
      # it — so the Server app could only be built by someone who happened to
      # run this by hand first, which is why it only ever existed on the
      # maintainer's Mac. Composer is already installed with --no-dev above,
      # which is what the script warns about when it is not.
      - name: Package the application
        run: php scripts/package-app-payload.php

      # Linux adds an overlay: the binary is named `soundchex-server` rather
      # than the crate's `soundchex`, which is also what the client package
      # installs to /usr/bin -- the two would overwrite each other -- and is
      # the name a runit `run` script calls (`soundchex-server --headless`).
      # Only deb and AppImage, which is what is published.
      #
      # Not applied to macOS or Windows: renaming their executable would break
      # the Windows Run-key autostart of every existing install, which points
      # at the old file name.
      - name: Build the Server app
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npm run build:server -- --config src-tauri/tauri.server.linux.conf.json
          else
            npm run build:server
          fi

      # Fixed names, checksummed, for the release. HatCOS's package downloads
      # a fixed URL and checks it against the .sha256 beside it; Tauri's own
      # names carry the version and a space ("SoundChex Server_0.2.0_arm64.deb")
      # which GitHub rewrites on upload, so neither is predictable.
      - name: Collect Linux release assets
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p release-assets
          deb=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -1 || true)
          appimage=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1 || true)
          [ -n "$deb" ] || { echo "no .deb was built"; ls -R src-tauri/target/release/bundle; exit 1; }
          [ -n "$appimage" ] || { echo "no .AppImage was built"; ls -R src-tauri/target/release/bundle; exit 1; }

          base="soundchex-server-app-linux-${{ matrix.arch }}"
          cp "$deb" "release-assets/${base}.deb"
          cp "$appimage" "release-assets/${base}.AppImage"

          # The binary the package installs must be the one a run script
          # calls, and it must answer --help without a display.
          dpkg-deb -c "release-assets/${base}.deb" | grep -E ' \./usr/bin/soundchex-server$' \
            || { echo "the .deb does not install /usr/bin/soundchex-server"; dpkg-deb -c "release-assets/${base}.deb" | grep usr/bin; exit 1; }
          dpkg-deb -x "release-assets/${base}.deb" deb-unpacked
          env -u DISPLAY -u WAYLAND_DISPLAY deb-unpacked/usr/bin/soundchex-server --help

          cd release-assets
          for f in "${base}.deb" "${base}.AppImage"; do
            sha256sum "$f" > "$f.sha256"
          done
          cat ./*.sha256

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: release-app-linux-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: soundchex-server-app-${{ matrix.label }}
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: warn

  release:
    # Publishing needs write access to releases. The default token is
    # read-only for this repository, so without this the job builds
    # everything and then 403s at the upload — "Resource not accessible by
    # integration", which reads like a broken action rather than a missing
    # permission (S-421).
    permissions:
      contents: write
    #
    # Waits for the app builds too, because the Linux app is published here.
    # `!cancelled()` plus the runtime results rather than plain success: a
    # macOS or Windows app failure must not hold back a release whose runtime
    # built. The Linux app is still required -- its download below fails the
    # job when it is missing -- because HatCOS fetches it from a fixed URL and
    # a release without it would 404 there with nothing here saying why.
    if: >-
      !cancelled()
      && startsWith(github.ref, 'refs/tags/server-v')
      && needs.build.result == 'success'
      && needs.build-windows.result == 'success'
    needs: [build, build-windows, app]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Runtime archives only. Without a pattern this also pulled every app
      # bundle -- the dmg, msi and exe -- just to throw them away.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: soundchex-server-[lmw]*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-app-linux-*
          merge-multiple: true

      - name: Check the Linux app is present
        run: |
          ls -la dist
          ls dist/soundchex-server-app-linux-*.deb dist/soundchex-server-app-linux-*.AppImage >/dev/null
          cd dist && sha256sum -c soundchex-server-app-linux-*.sha256
      - uses: softprops/action-gh-release@v2
        with:
          # A tag carrying -beta/-alpha/-rc marks the release as a
          # pre-release, the way the client workflow already does. Without
          # this the server published as a full release while the client of
          # the same version showed as a beta, and `releases/latest` — which
          # skips pre-releases — would have offered a beta server as current.
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          files: |
            dist/soundchex-server-*.tar.gz
            dist/soundchex-server-*.zip
            dist/soundchex-server-*.deb
            dist/soundchex-server-*.AppImage
            dist/soundchex-server-*.sha256
