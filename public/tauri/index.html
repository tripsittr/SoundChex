<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SoundChex</title>
<style>
    /*
      The connect screen. This is the only markup the shell itself owns —
      everything after this point is the real app, served by the host.

      Hardcoding a server address would mean rebuilding the app per household,
      so it is asked for once and remembered.
    */
    :root { color-scheme: dark; }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        background: #08080b;
        color: #f4f4f5;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        /* Room for the notch and the home indicator on phones. */
        padding-top: max(2rem, env(safe-area-inset-top));
        padding-bottom: max(2rem, env(safe-area-inset-bottom));
    }

    main { width: 100%; max-width: 22rem; }

    h1 { margin: 0 0 .35rem; font-size: 1.4rem; letter-spacing: -0.01em; }

    p.lede { margin: 0 0 1.5rem; color: #a1a1aa; font-size: .875rem; }

    label { display: block; margin-bottom: .4rem; font-size: .8125rem; color: #d4d4d8; }

    input {
        width: 100%;
        padding: .7rem .8rem;
        border: 1px solid #27272a;
        border-radius: .6rem;
        background: #131318;
        color: inherit;
        font: inherit;
        /* 16px minimum or iOS zooms the field on focus. */
        font-size: 16px;
    }

    input:focus { outline: 2px solid #e11d3a; outline-offset: 1px; border-color: transparent; }

    button {
        width: 100%;
        margin-top: .75rem;
        padding: .7rem 1rem;
        border: 0;
        border-radius: .6rem;
        background: #e11d3a;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: default; }

    .status { margin-top: .9rem; min-height: 1.25rem; font-size: .8125rem; color: #a1a1aa; }
    .status[data-error="true"] { color: #fda4af; }

    .hint { margin-top: 1.5rem; font-size: .75rem; color: #71717a; }
</style>
</head>
<body>
<main>
    <h1>Connect to your library</h1>
    <p class="lede">The address of your SoundChex server. Asked once, then remembered.</p>

    <form id="connect">
        <label for="host">Server address</label>
        <input id="host" name="host" type="url" inputmode="url" autocapitalize="none"
               autocorrect="off" spellcheck="false" required
               placeholder="https://yourmachine.ts.net">
        <button type="submit">Connect</button>
    </form>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <p class="hint">
        Over Tailscale this is your machine's MagicDNS name. It is stored on
        this device only.
    </p>
</main>

<script type="module">
    const KEY = 'soundchex.host';
    const form = document.getElementById('connect');
    const field = document.getElementById('host');
    const status = document.getElementById('status');

    const say = (message, isError = false) => {
        status.textContent = message;
        status.dataset.error = String(isError);
    };

    /** Adds a scheme if the user typed a bare hostname, and drops any path. */
    function normalise(value) {
        const trimmed = value.trim();

        if (trimmed === '') return null;

        // Default to https: this app is only reachable over TLS, and a typed
        // "http://" would silently fail the CSP rather than explaining itself.
        const withScheme = /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;

        try {
            const url = new URL(withScheme);

            return url.protocol === 'https:' || url.hostname === 'localhost'
                ? url.origin
                : null;
        } catch {
            return null;
        }
    }

    /**
     * Confirms something is actually listening before navigating.
     *
     * Without this a typo lands on a blank page with no way back, because the
     * connect screen has already been replaced.
     *
     * `no-cors` is essential, not incidental. This page is served from a
     * tauri:// origin, so a normal fetch to the server is cross-origin, and
     * the server sends no CORS headers — the browser rejects the response
     * before any status is readable and every address looks unreachable. An
     * opaque response cannot be inspected, but the request either reached the
     * network or it threw, and that is the only thing being asked here.
     *
     * The navigation that follows is a top-level one, which CORS does not
     * apply to, so this restriction never affects the app itself.
     */
    async function reachable(origin) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8000);

        try {
            await fetch(`${origin}/login`, {
                mode: 'no-cors',
                signal: controller.signal,
                credentials: 'omit',
                cache: 'no-store',
            });

            return true;
        } catch {
            // A DNS failure, a refused connection, or the timeout above.
            return false;
        } finally {
            clearTimeout(timeout);
        }
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const origin = normalise(field.value);

        if (origin === null) {
            say('That does not look like a valid https address.', true);

            return;
        }

        form.querySelector('button').disabled = true;
        say('Checking…');

        if (!await reachable(origin)) {
            say('Could not reach that address. Is the server running?', true);
            form.querySelector('button').disabled = false;

            return;
        }

        localStorage.setItem(KEY, origin);
        window.location.replace(origin);
    });

    /**
     * Straight in on every launch after the first.
     *
     * There is deliberately no "did the last attempt work" flag here. This
     * page and the app live on different origins (tauri:// and https://), so
     * they have separate localStorage — the app could never clear a flag set
     * here, and the warning would fire on every launch instead of only after
     * a real failure.
     *
     * Recovering from a wrong address is therefore a manual step: delete the
     * app's data, or reinstall. Rare enough to be worth the simplicity, since
     * the address is entered once.
     */
    const saved = localStorage.getItem(KEY);

    if (saved) {
        field.value = saved;
        say('Connecting…');
        window.location.replace(saved);
    } else {
        field.focus();
    }
</script>
</body>
</html>
