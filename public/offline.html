<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — SoundChex</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #08080b;
            color: #f4f4f5;
            font-family: Figtree, ui-sans-serif, system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 1.5rem;
        }
        .glyph { font-size: 3rem; opacity: 0.5; }
        h1 { margin: 1.5rem 0 0.5rem; font-size: 1.5rem; }
        p { margin: 0; color: #b8b8c0; max-width: 28rem; line-height: 1.6; }
        button {
            margin-top: 1.75rem;
            border: 0;
            border-radius: 0.375rem;
            background: #e11d3a;
            color: #fff;
            font: inherit;
            font-weight: 600;
            padding: 0.65rem 1.5rem;
            cursor: pointer;
        }
        button:hover { background: #ff2a4a; }
    </style>
</head>
<body>
    <main>
        <p class="glyph" aria-hidden="true">📡</p>
        <h1>Can't reach your library</h1>
        <p>
            SoundChex runs on your own server, so it needs a connection to that
            machine — either on your home network or through your tunnel.
        </p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>

    <script type="module">
        /*
         * Rebuild the page from the device's copy of the library.
         *
         * This page is what the service worker serves when a navigation fails,
         * and it previously loaded no scripts at all — so the mirror could
         * never be reached and "offline" meant a dead end even with the whole
         * catalogue sitting on the device.
         *
         * The bundle filename is content-hashed, so it is resolved from Vite's
         * manifest rather than written in here, where it would go stale on the
         * next build and fail silently.
         */
        try {
            const manifest = await fetch('/build/manifest.json', { cache: 'force-cache' })
                .then((response) => response.json());

            const entry = Object.entries(manifest)
                .find(([key]) => key.endsWith('library/index.js'));

            if (entry) {
                await import(`/build/${entry[1].file}`);

                // The module exposes the library once it has loaded.
                const drawn = await window.soundchexLibrary?.takeOver();

                // Nothing to draw — no sync yet, or a screen this cannot
                // rebuild. The static message above is the honest answer.
                if (!drawn) document.querySelector('main')?.removeAttribute('hidden');
            }
        } catch {
            // The manifest is itself a network request. If it is not cached,
            // the static page stands.
        }
    </script>
</body>
</html>
