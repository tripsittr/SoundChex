[package]
name = "soundchex"
version = "0.1.0"
description = "SoundChex desktop and mobile client"
edition = "2021"
rust-version = "1.77.2"

# The library target is what the mobile entrypoints call into; desktop uses
# main.rs. Both are thin — the app itself is served by the Laravel host.
[lib]
name = "soundchex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"

# Biometric is iOS and Android only — there is no desktop implementation, so a
# plain dependency would fail the macOS, Windows and Linux builds.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-biometric = "2"

[features]
# Enabled by `tauri dev`; keeps devtools out of release builds.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
