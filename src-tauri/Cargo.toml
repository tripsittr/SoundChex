[package]
name = "soundchex"
version = "0.1.0"
description = "SoundChex desktop and mobile client"
edition = "2021"
rust-version = "1.77.2"

# The library target is what the mobile entrypoints call into; desktop uses
# main.rs. Both are thin — the app itself is served by the Laravel host.
[lib]
name = "soundchex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
# Opens a URL in the user's real browser. A webview has no tabs, so
# `target="_blank"` is silently ignored — every external link in the panel is
# dead without this, which is where the Integrations page sends people to
# Lidarr, Radarr and Sonarr.
tauri-plugin-opener = "2"
# generate_context! expands the updater's configuration into code that parses
# JSON, so this is required even though nothing here uses it directly.
serde_json = "1"


[features]
# Enabled by `tauri dev`; keeps devtools out of release builds.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
