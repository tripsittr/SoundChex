[package]
name = "soundchex"
version = "0.1.0"
description = "SoundChex desktop and mobile client"
edition = "2021"
rust-version = "1.77.2"

# The library target is what the mobile entrypoints call into; desktop uses
# main.rs. Both are thin — the app itself is served by the Laravel host.
[lib]
name = "soundchex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` serves downloaded media files back to the webview with range
# support, so a downloaded film can seek — the whole point of native storage
# (offline rebuild Step 2). Scoped to the media directory in tauri.conf.json.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
# Opens a URL in the user's real browser. A webview has no tabs, so
# `target="_blank"` is silently ignored — every external link in the panel is
# dead without this, which is where the Integrations page sends people to
# Lidarr, Radarr and Sonarr.
tauri-plugin-opener = "2"
# generate_context! expands the updater's configuration into code that parses
# JSON, so this is required even though nothing here uses it directly.
serde_json = "1"

# `statvfs` for the free_space command, on every Unix platform we target —
# macOS, iOS, Linux, Android. One extern "C" call; no larger dependency (like
# sysinfo) pulled in for a single number.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows uses GetDiskFreeSpaceExW instead.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }


[features]
# Enabled by `tauri dev`; keeps devtools out of release builds.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
