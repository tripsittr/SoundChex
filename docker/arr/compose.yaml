# Radarr, Sonarr and Lidarr, plus the download client they hand files to.
#
# These do a different job from SoundChex. SoundChex catalogs files that exist;
# these go and find new ones. They meet at one place: the folder the library
# scanner already watches, so a completed download becomes a catalogued item
# without anything having to tell SoundChex it happened.
#
# Readarr is deliberately absent. It was retired by its maintainers in 2025 and
# its metadata backend has been unreliable since; books here are enriched from
# Open Library, which is maintained and already works.
#
# NOTHING IS CONFIGURED TO DOWNLOAD ANYTHING. No indexers are defined and none
# ship with these images. The stack is inert until someone adds one by hand.
#
# Start with:   docker compose -f docker/arr/compose.yaml up -d
# Stop with:    docker compose -f docker/arr/compose.yaml down
#
# Paths come from .env (see .env.example). They are bind mounts of real
# directories on this machine, so what these containers write is immediately
# visible to the scanner — and equally, what they delete is really deleted.

name: soundchex-arr

x-common: &common
  restart: unless-stopped
  environment: &env
    # The host user, so files land owned by whoever runs SoundChex rather than
    # by root. Without this the scanner finds files it cannot read, which looks
    # like a failed download rather than a permissions problem.
    PUID: ${ARR_PUID:-501}
    PGID: ${ARR_PGID:-20}
    TZ: ${ARR_TZ:-America/Chicago}

services:
  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:5.14.0
    container_name: soundchex-radarr
    ports:
      # Bound to loopback, not 0.0.0.0. These have no authentication until it is
      # set up inside each app, and this machine is reachable over Tailscale —
      # a default bind would put an unauthenticated admin panel on the tailnet.
      - "127.0.0.1:7878:7878"
    volumes:
      - ${ARR_CONFIG_ROOT}/radarr:/config
      - ${SOUNDCHEX_MEDIA_ROOT}:/media
      - ${ARR_DOWNLOADS_ROOT}:/downloads

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:4.0.10
    container_name: soundchex-sonarr
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - ${ARR_CONFIG_ROOT}/sonarr:/config
      - ${SOUNDCHEX_MEDIA_ROOT}:/media
      - ${ARR_DOWNLOADS_ROOT}:/downloads

  lidarr:
    <<: *common
    image: lscr.io/linuxserver/lidarr:2.5.3
    container_name: soundchex-lidarr
    ports:
      - "127.0.0.1:8686:8686"
    volumes:
      - ${ARR_CONFIG_ROOT}/lidarr:/config
      - ${SOUNDCHEX_MEDIA_ROOT}:/media
      - ${ARR_DOWNLOADS_ROOT}:/downloads

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:5.0.3
    container_name: soundchex-qbittorrent
    environment:
      <<: *env
      WEBUI_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
      # The listening port is published on all interfaces deliberately: a
      # torrent client that cannot accept incoming connections is throttled to
      # a fraction of its speed. Nothing is served on it but the protocol.
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ${ARR_CONFIG_ROOT}/qbittorrent:/config
      - ${ARR_DOWNLOADS_ROOT}:/downloads
