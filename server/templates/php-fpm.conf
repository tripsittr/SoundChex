; SoundChex bundled server — php-fpm pool (S-151).
;
; A TCP listener (not a unix socket): portable across macOS/Linux/Windows, and
; it sidesteps the 104-char unix-socket path limit that bit the Step 0 PoC.
; Windows has no unix sockets at all, so TCP is the only cross-platform choice.
;
; Placeholders substituted by the supervisor / installer at launch:
;   {$SOUNDCHEX_RUN}    a writable runtime dir (pid + logs)
;   {$SOUNDCHEX_FPM}    the listen address (default 127.0.0.1:9100)
;   {$SOUNDCHEX_USER}   the user to run workers as (POSIX only; omit on Windows)

[global]
pid = {$SOUNDCHEX_RUN}/php-fpm.pid
error_log = {$SOUNDCHEX_RUN}/php-fpm.log
daemonize = no

[soundchex]
listen = {$SOUNDCHEX_FPM}
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; The upload cap is ours. Caddy gates the body at 25 MB; PHP agrees so a large
; multipart part is accepted end to end (artisan serve dies at 2 MB).
php_admin_value[upload_max_filesize] = 25M
php_admin_value[post_max_size] = 26M
php_admin_value[memory_limit] = 512M

; Laravel needs the app's env; don't strip it from workers.
clear_env = no
catch_workers_output = yes
